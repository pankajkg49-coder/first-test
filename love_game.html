<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Game 😄</title>
<style>
    body {
        text-align: center;
        font-family: Arial;
        background: #ffe6e6;
        padding-top: 50px;
    }
    button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 10px;
        border: none;
    }
    .yes { background: #4CAF50; color: white; }
    .no { background: #f44336; color: white; position: relative; }
</style>
</head>
<body>

<h2 id="question">Q1: क्या तुम मुझसे प्यार करती हो? 💕</h2>

<div id="buttons"></div>

<script>
let step = 1;
loadQ1();

// Load Question 1
function loadQ1() {
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="kartiHun()">Karti hun</button>
        <button class="no" onclick="nhiKartiHun()">Nhi karti hun</button>
    `;
}

// Q1 Yes
function kartiHun() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// Q1 No → Go to Q3
function nhiKartiHun() {
    step = 3;
    document.getElementById("question").innerHTML = "Q3: तो किससे करती हो? 🤔";
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="kisiSeNhi()">Kisi se nhi karti hun</button>
        <button class="yes" onclick="tumseKarti()">Tumse karti ho</button>
    `;
}

// Q3 Second Option → End
function tumseKarti() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// Q3 First Option → Next Question (Q4)
function kisiSeNhi() {
    step = 4;
    document.getElementById("question").innerHTML = "Q4: मेरा प्यार स्वीकार कर लो! 🥺";
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="acceptLove()">हाँ</button>
        <button class="no" id="noBtn" onclick="moveButton()">कभी नहीं</button>
    `;
}

// Q4 Yes
function acceptLove() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// Q4 No → Button bhaagega 😂
function moveButton() {
    let btn = document.getElementById("noBtn");
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;
    btn.style.position = "absolute";
    btn.style.left = x + "px";
    btn.style.top = y + "px";
}
</script>

</body>
</html>

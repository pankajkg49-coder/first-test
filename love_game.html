<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Game 😄</title>
<style>
    body {
        text-align: center;
        font-family: Arial;
        background: #ffe6e6;
        padding-top: 50px;
    }
    button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 10px;
        border: none;
    }
    .yes { background: #4CAF50; color: white; }
    .no { background: #f44336; color: white; position: relative; }
</style>
</head>
<body>

<h2 id="question">Do you love me? 💕</h2>

<div id="buttons"></div>

<script>
loadFirstQuestion();

// First Question
function loadFirstQuestion() {
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="loveYes()">Yes, I do</button>
        <button class="no" onclick="loveNo()">No, I don't</button>
    `;
}

// If Yes → End
function loveYes() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// If No → Go to next
function loveNo() {
    document.getElementById("question").innerHTML = "Then who do you love? 🤔";
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="noOne()">I don't love anyone</button>
        <button class="yes" onclick="youOnly()">I love you</button>
    `;
}

// If "I love you" → End
function youOnly() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// If "No one" → Next Question
function noOne() {
    document.getElementById("question").innerHTML = "Please accept my love 🥺";
    document.getElementById("buttons").innerHTML = `
        <button class="yes" onclick="acceptLove()">Yes</button>
        <button class="no" id="noBtn" onclick="moveButton()">No</button>
    `;
}

// Accept → End
function acceptLove() {
    document.body.innerHTML = "<h1>Love you so much ❤️🥰</h1>";
}

// No → Button runs away 😂
function moveButton() {
    let btn = document.getElementById("noBtn");
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;
    btn.style.position = "absolute";
    btn.style.left = x + "px";
    btn.style.top = y + "px";
}
</script>

</body>
</html>

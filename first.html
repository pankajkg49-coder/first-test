<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vaishnavi! 🎉💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #1a1a2e;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: bgChange 15s infinite;
            z-index: -1;
        }
        .stars {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            max-width: 700px;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 3.5em;
            color: #fff;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .emoji-group {
            font-size: 4em;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .emoji {
            animation: float 3s ease-in-out infinite;
        }
        .emoji:nth-child(2) {
            animation-delay: 0.5s;
        }
        .emoji:nth-child(3) {
            animation-delay: 1s;
        }
        .emoji:nth-child(4) {
            animation-delay: 1.5s;
        }
        .emoji:nth-child(5) {
            animation-delay: 2s;
        }
        p {
            color: #fff;
            font-size: 1.4em;
            margin: 20px 0;
            line-height: 1.8;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @keyframes bgChange {
            0% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            25% { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
            50% { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
            75% { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
            100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <h1>🎉 Happy Birthday Vaishnavi! 🎉</h1>
        <div class="emoji-group">
            <span class="emoji">🎂</span>
            <span class="emoji">🎈</span>
            <span class="emoji">🎁</span>
            <span class="emoji">💖</span>
            <span class="emoji">✨</span>
        </div>
        <p>आपको जन्मदिन की हार्दिक शुभकामनाएं! 🥳</p>
        <p>इस खास दिन आपकी सभी खुशियां दोगुनी हों!</p>
        <p>हमेशा मुस्कुराते रहो और ज़िंदगी का हर पल enjoy करो!</p>
        <div class="buttons">
            <button onclick="createConfetti()">🎊 Celebrate!</button>
            <button onclick="createHearts()">❤️ Send Love!</button>
        </div>
    </div>

    <script>
        // Create stars in background
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'stars';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(star);
            }
        }
        createStars();

        function createConfetti() {
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = -10 + 'px';
                confetti.style.background = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#ff69b4'][Math.floor(Math.random() * 5)];
                confetti.style.pointerEvents = 'none';
                confetti.style.borderRadius = '50%';
                document.body.appendChild(confetti);
                let top = 0;
                const speed = Math.random() * 3 + 2;
                const angle = Math.random() * 30 - 15;
                const interval = setInterval(() => {
                    top += speed;
                    confetti.style.top = top + 'px';
                    confetti.style.left = (parseFloat(confetti.style.left) + Math.sin(angle * Math.PI / 180)) + 'px';
                    if (top > window.innerHeight) {
                        clearInterval(interval);
                        confetti.remove();
                    }
                }, 20);
            }
        }

        function createHearts() {
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.fontSize = '2em';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.top = window.innerHeight + 'px';
                heart.style.pointerEvents = 'none';
                document.body.appendChild(heart);
                let top = window.innerHeight;
                const speed = Math.random() * 2 + 1;
                const interval = setInterval(() => {
                    top -= speed;
                    heart.style.top = top + 'px';
                    if (top < -50) {
                        clearInterval(interval);
                        heart.remove();
                    }
                }, 20);
            }
        }

        // Click anywhere to create sparkles
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 10; i++) {
                const sparkle = document.createElement('div');
                sparkle.innerHTML = '✨';
                sparkle.style.position = 'fixed';
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.fontSize = '1.5em';
                sparkle.style.opacity = '1';
                document.body.appendChild(sparkle);
                const angle = (i / 10) * Math.PI * 2;
                const velocity = 3;
                let x = e.clientX;
                let y = e.clientY;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                let opacity = 1;
                const interval = setInterval(() => {
                    x += vx;
                    y += vy;
                    opacity -= 0.1;
                    sparkle.style.left = x + 'px';
                    sparkle.style.top = y + 'px';
                    sparkle.style.opacity = opacity;
                    if (opacity <= 0) {
                        clearInterval(interval);
                        sparkle.remove();
                    }
                }, 20);
            }
        });
    </script>
</body>
</html>
